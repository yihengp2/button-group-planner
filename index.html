<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>鸣潮矩阵配队助手</title>
  <meta name="description" content="鸣潮矩阵配队助手：快速组建矩阵配队，自动追踪角色剩余使用次数。">
  <meta property="og:title" content="鸣潮矩阵配队助手">
  <meta property="og:description" content="快速组建矩阵配队，自动追踪角色剩余使用次数。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yihengp2.github.io/button-group-planner/">
  <meta property="og:image" content="https://raw.githubusercontent.com/ryanbenson/wuthering-waves-assets/master/images/Qingxiao.png">
  <meta property="og:image:secure_url" content="https://raw.githubusercontent.com/ryanbenson/wuthering-waves-assets/master/images/Qingxiao.png">
  <meta property="og:image:alt" content="清宵">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="鸣潮矩阵配队助手">
  <meta name="twitter:description" content="快速组建矩阵配队，自动追踪角色剩余使用次数。">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/ryanbenson/wuthering-waves-assets/master/images/Qingxiao.png">
  <link rel="image_src" href="https://raw.githubusercontent.com/ryanbenson/wuthering-waves-assets/master/images/Qingxiao.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>鸣潮矩阵配队助手</h1>
        <p>快速组建矩阵配队，自动追踪角色剩余使用次数。</p>
        <div id="saveStatus" class="save-status">● 已保存到本机</div>
      </div>
      <div class="top-actions">
        <button id="shareBtn" class="btn primary" type="button">分享图片</button>
        <button id="clearRoundBtn" class="btn" type="button">重新开始本轮</button>
        <button id="settingsBtn" class="btn" type="button">⚙ 角色设置</button>
      </div>
    </header>

    <section class="stats" aria-label="当前状态">
      <div class="stat"><span>配队</span><strong id="teamCount">0</strong></div>
      <div class="stat"><span>已用次数</span><strong id="usedCount">0</strong></div>
      <div class="stat"><span>剩余次数</span><strong id="remainingCount">0</strong></div>
      <div class="stat"><span>可选角色</span><strong id="availableCount">0</strong></div>
    </section>

    <section id="roverPanel" class="rover-panel">
      <div>
        <strong>漂泊者共享次数</strong>
        <p>导电 / 气动 / 衍射 / 湮灭共同共享 1 次；选择任一形态后，其他形态同时不可用。</p>
      </div>
      <span id="roverBadge" class="usage-badge">1/1</span>
    </section>

    <section class="teams-section">
      <div class="section-head">
        <div>
          <h2>配队</h2>
          <p>点击空位选择角色；使用 ↑ / ↓ 可以快速调整配队顺序。</p>
        </div>
        <button id="addTeamBtn" class="btn primary" type="button">+ 添加配队</button>
      </div>
      <div id="teamList" class="team-list"></div>
    </section>

    <div id="notice" class="notice" aria-live="polite"></div>

    <footer>
      <span>角色名单参考 <a href="https://ww.nanoka.cc/character/" target="_blank" rel="noreferrer">nanoka.cc</a></span>
      <span>角色头像来自 <a href="https://github.com/ryanbenson/wuthering-waves-assets" target="_blank" rel="noreferrer">wuthering-waves-assets</a></span>
    </footer>
  </main>

  <div id="pickerBackdrop" class="modal-backdrop" hidden>
    <section class="modal picker-modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="modal-head">
        <div>
          <h2 id="pickerTitle">选择角色</h2>
          <p id="pickerContext"></p>
        </div>
        <button id="closePickerBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <label class="search-wrap">
        <span>搜索角色</span>
        <input id="characterSearch" type="search" placeholder="输入角色名…" autocomplete="off">
      </label>
      <div id="pickerContent"></div>
    </section>
  </div>

  <div id="settingsBackdrop" class="modal-backdrop" hidden>
    <section class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <div>
          <h2 id="settingsTitle">角色设置</h2>
          <p>平时无需修改；可在规则变化时调整名称和使用次数。</p>
        </div>
        <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>

      <label class="search-wrap">
        <span>查找角色</span>
        <input id="settingsSearch" type="search" placeholder="搜索设置…" autocomplete="off">
      </label>

      <div id="settingsCharacterList" class="settings-list"></div>

      <div class="settings-actions">
        <button id="restoreDefaultsBtn" class="btn" type="button">恢复默认角色设置</button>
        <button id="exportBtn" class="btn" type="button">导出备份</button>
        <button id="importBtn" class="btn" type="button">导入备份</button>
        <button id="resetAllBtn" class="btn danger" type="button">重置全部数据</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="settings-note">漂泊者始终共享 1 次。角色头像只用于识别，若外部头像资源无法加载，会自动显示文字占位。</p>
    </section>
  </div>

  <script src="loader.js?v=20260820-1"></script>
</body>
</html>
